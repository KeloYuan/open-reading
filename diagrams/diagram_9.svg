<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <!-- 背景 -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="500" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">
    主题系统架构设计
  </text>
  
  <!-- ThemeNotifier -->
  <g id="theme-notifier">
    <rect x="350" y="80" width="300" height="100" fill="#E74C3C" stroke="#C0392B" stroke-width="3" rx="10"/>
    <text x="500" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
      ThemeNotifier
    </text>
    <text x="500" y="135" text-anchor="middle" font-size="13" fill="white">
      主题状态管理 (ChangeNotifier)
    </text>
    <text x="500" y="160" text-anchor="middle" font-size="12" fill="white">
      • 当前主题 • 强调色 • 亮度模式
    </text>
  </g>
  
  <!-- 预设主题 -->
  <g id="preset-themes">
    <rect x="50" y="230" width="400" height="220" fill="white" stroke="#3498DB" stroke-width="2" rx="8"/>
    <text x="250" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
      预设主题 (AppThemes)
    </text>
    
    <!-- 白天模式 -->
    <rect x="70" y="280" width="170" height="70" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" rx="6"/>
    <text x="155" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">
      白天模式
    </text>
    <text x="155" y="325" text-anchor="middle" font-size="11" fill="#666">背景: #FFFFFF</text>
    <text x="155" y="340" text-anchor="middle" font-size="11" fill="#666">文字: #000000</text>
    
    <!-- 夜间模式 -->
    <rect x="260" y="280" width="170" height="70" fill="#2C3E50" stroke="#1A252F" stroke-width="2" rx="6"/>
    <text x="345" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      夜间模式
    </text>
    <text x="345" y="325" text-anchor="middle" font-size="11" fill="#ECF0F1">背景: #1E1E1E</text>
    <text x="345" y="340" text-anchor="middle" font-size="11" fill="#ECF0F1">文字: #E0E0E0</text>
    
    <!-- 护眼模式 -->
    <rect x="70" y="365" width="170" height="70" fill="#F5E6D3" stroke="#D4A574" stroke-width="2" rx="6"/>
    <text x="155" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#654321">
      护眼模式
    </text>
    <text x="155" y="410" text-anchor="middle" font-size="11" fill="#654321">背景: #F5E6D3</text>
    <text x="155" y="425" text-anchor="middle" font-size="11" fill="#654321">文字: #3C2F1E</text>
    
    <!-- 自定义主题 -->
    <rect x="260" y="365" width="170" height="70" fill="url(#gradient-custom)" stroke="#9B59B6" stroke-width="2" rx="6"/>
    <defs>
      <linearGradient id="gradient-custom" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
      </linearGradient>
    </defs>
    <text x="345" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      自定义主题
    </text>
    <text x="345" y="410" text-anchor="middle" font-size="11" fill="white">用户自定义配色</text>
    <text x="345" y="425" text-anchor="middle" font-size="11" fill="white">支持渐变和毛玻璃</text>
  </g>
  
  <!-- 阅读主题 -->
  <g id="reading-themes">
    <rect x="550" y="230" width="400" height="220" fill="white" stroke="#F39C12" stroke-width="2" rx="8"/>
    <text x="750" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
      阅读主题 (ReadingTheme)
    </text>
    
    <!-- 主题属性 -->
    <rect x="570" y="280" width="360" height="155" fill="#FEF5E7" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="590" y="305" font-size="12" font-weight="bold" fill="#333">核心属性：</text>
    <text x="590" y="328" font-size="11" fill="#666">• backgroundColor: Color (背景色)</text>
    <text x="590" y="348" font-size="11" fill="#666">• textColor: Color (文字颜色)</text>
    <text x="590" y="368" font-size="11" fill="#666">• fontSize: double (字体大小)</text>
    <text x="590" y="388" font-size="11" fill="#666">• lineHeight: double (行高)</text>
    <text x="590" y="408" font-size="11" fill="#666">• fontFamily: String (字体)</text>
    <text x="590" y="428" font-size="11" fill="#666">• brightness: Brightness (亮度)</text>
  </g>
  
  <!-- 配置存储 -->
  <rect x="150" y="500" width="220" height="100" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="8"/>
  <text x="260" y="530" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
    SharedPreferences
  </text>
  <text x="260" y="555" text-anchor="middle" font-size="12" fill="white">
    持久化存储
  </text>
  <text x="260" y="575" text-anchor="middle" font-size="11" fill="white">
    保存主题配置和用户偏好
  </text>
  
  <!-- Material 3 -->
  <rect x="420" y="500" width="220" height="100" fill="#2980B9" stroke="#1F618D" stroke-width="2" rx="8"/>
  <text x="530" y="530" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
    Material 3 ThemeData
  </text>
  <text x="530" y="555" text-anchor="middle" font-size="12" fill="white">
    Material主题系统
  </text>
  <text x="530" y="575" text-anchor="middle" font-size="11" fill="white">
    colorScheme • textTheme • ...
  </text>
  
  <!-- UI应用 -->
  <rect x="690" y="500" width="220" height="100" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="8"/>
  <text x="800" y="530" text-anchor="middle" font-size="15" font-weight="bold" fill="white">
    UI组件应用
  </text>
  <text x="800" y="555" text-anchor="middle" font-size="12" fill="white">
    Theme.of(context)
  </text>
  <text x="800" y="575" text-anchor="middle" font-size="11" fill="white">
    自动响应主题变化
  </text>
  
  <!-- 主题切换流程 -->
  <g id="switch-flow">
    <rect x="50" y="650" width="900" height="120" fill="#ECF0F1" stroke="#95A5A6" stroke-width="2" rx="8"/>
    <text x="500" y="680" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">
      主题切换流程
    </text>
    
    <!-- 流程步骤 -->
    <rect x="80" y="695" width="130" height="50" fill="#3498DB" stroke="#2874A6" stroke-width="1" rx="4"/>
    <text x="145" y="725" text-anchor="middle" font-size="11" fill="white">1. 用户选择主题</text>
    
    <rect x="230" y="695" width="130" height="50" fill="#9B59B6" stroke="#7D3C98" stroke-width="1" rx="4"/>
    <text x="295" y="725" text-anchor="middle" font-size="11" fill="white">2. 更新Notifier</text>
    
    <rect x="380" y="695" width="130" height="50" fill="#F39C12" stroke="#CA6F1E" stroke-width="1" rx="4"/>
    <text x="445" y="725" text-anchor="middle" font-size="11" fill="white">3. 保存配置</text>
    
    <rect x="530" y="695" width="130" height="50" fill="#27AE60" stroke="#1E8449" stroke-width="1" rx="4"/>
    <text x="595" y="725" text-anchor="middle" font-size="11" fill="white">4. 通知监听者</text>
    
    <rect x="680" y="695" width="130" height="50" fill="#E74C3C" stroke="#C0392B" stroke-width="1" rx="4"/>
    <text x="745" y="725" text-anchor="middle" font-size="11" fill="white">5. UI重建</text>
    
    <!-- 箭头 -->
    <defs>
      <marker id="arrow-theme" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#666" />
      </marker>
    </defs>
    
    <line x1="210" y1="720" x2="230" y2="720" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)"/>
    <line x1="360" y1="720" x2="380" y2="720" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)"/>
    <line x1="510" y1="720" x2="530" y2="720" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)"/>
    <line x1="660" y1="720" x2="680" y2="720" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)"/>
  </g>
  
  <!-- 连接线 -->
  <line x1="500" y1="180" x2="250" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)" stroke-dasharray="4,4"/>
  <line x1="500" y1="180" x2="750" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)" stroke-dasharray="4,4"/>
  
  <line x1="250" y1="450" x2="260" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)"/>
  <line x1="500" y1="450" x2="530" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)"/>
  <line x1="750" y1="450" x2="800" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow-theme)"/>
</svg>