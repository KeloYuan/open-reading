<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850">
  <!-- 背景 -->
  <rect width="1100" height="850" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="550" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">
    Flutter组件层次结构图
  </text>
  
  <!-- 根组件 -->
  <g id="root">
    <rect x="450" y="70" width="200" height="50" fill="#E74C3C" stroke="#C0392B" stroke-width="3" rx="8"/>
    <text x="550" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      XiaoYuanReaderApp
    </text>
  </g>
  
  <!-- MaterialApp -->
  <g id="material-app">
    <rect x="450" y="150" width="200" height="50" fill="#3498DB" stroke="#2874A6" stroke-width="2" rx="8"/>
    <text x="550" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      MaterialApp
    </text>
  </g>
  
  <!-- 主要页面 -->
  <!-- HomePage -->
  <g id="home-page">
    <rect x="50" y="250" width="180" height="60" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="6"/>
    <text x="140" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      HomePageResponsive
    </text>
    <text x="140" y="293" text-anchor="middle" font-size="11" fill="white">主页</text>
  </g>
  
  <!-- LibraryPage -->
  <g id="library-page">
    <rect x="260" y="250" width="180" height="60" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="6"/>
    <text x="350" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      LibraryPage
    </text>
    <text x="350" y="293" text-anchor="middle" font-size="11" fill="white">书库页</text>
  </g>
  
  <!-- ReadingPage -->
  <g id="reading-page">
    <rect x="470" y="250" width="180" height="60" fill="#F39C12" stroke="#CA6F1E" stroke-width="2" rx="6"/>
    <text x="560" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      ReadingPageEnhanced
    </text>
    <text x="560" y="293" text-anchor="middle" font-size="11" fill="white">阅读页</text>
  </g>
  
  <!-- StatisticsPage -->
  <g id="stats-page">
    <rect x="680" y="250" width="180" height="60" fill="#16A085" stroke="#138D75" stroke-width="2" rx="6"/>
    <text x="770" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      DetailedStatsPage
    </text>
    <text x="770" y="293" text-anchor="middle" font-size="11" fill="white">统计页</text>
  </g>
  
  <!-- SettingsPage -->
  <g id="settings-page">
    <rect x="890" y="250" width="180" height="60" fill="#E67E22" stroke="#CA6F1E" stroke-width="2" rx="6"/>
    <text x="980" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      SettingsPage
    </text>
    <text x="980" y="293" text-anchor="middle" font-size="11" fill="white">设置页</text>
  </g>
  
  <!-- 二级组件 - HomePage子组件 -->
  <g id="home-widgets">
    <rect x="30" y="360" width="220" height="180" fill="none" stroke="#27AE60" stroke-width="2" stroke-dasharray="5,5" rx="6"/>
    
    <rect x="50" y="375" width="90" height="40" fill="#2ECC71" stroke="#27AE60" stroke-width="1" rx="4"/>
    <text x="95" y="400" text-anchor="middle" font-size="10" fill="white">RecentBooks</text>
    
    <rect x="150" y="375" width="90" height="40" fill="#2ECC71" stroke="#27AE60" stroke-width="1" rx="4"/>
    <text x="195" y="400" text-anchor="middle" font-size="10" fill="white">StatsCard</text>
    
    <rect x="50" y="425" width="90" height="40" fill="#2ECC71" stroke="#27AE60" stroke-width="1" rx="4"/>
    <text x="95" y="450" text-anchor="middle" font-size="10" fill="white">QuickActions</text>
    
    <rect x="150" y="425" width="90" height="40" fill="#2ECC71" stroke="#27AE60" stroke-width="1" rx="4"/>
    <text x="195" y="450" text-anchor="middle" font-size="10" fill="white">ReadingChart</text>
  </g>
  
  <!-- ReadingPage子组件 -->
  <g id="reading-widgets">
    <rect x="380" y="360" width="360" height="280" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="5,5" rx="6"/>
    
    <rect x="400" y="375" width="110" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="455" y="400" text-anchor="middle" font-size="10" fill="white">PageRenderer</text>
    
    <rect x="520" y="375" width="110" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="575" y="400" text-anchor="middle" font-size="10" fill="white">MenuOverlay</text>
    
    <rect x="640" y="375" width="90" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="685" y="400" text-anchor="middle" font-size="10" fill="white">TOCWidget</text>
    
    <rect x="400" y="425" width="110" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="455" y="450" text-anchor="middle" font-size="10" fill="white">ProgressBar</text>
    
    <rect x="520" y="425" width="110" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="575" y="450" text-anchor="middle" font-size="10" fill="white">SettingsPanel</text>
    
    <rect x="640" y="425" width="90" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="685" y="450" text-anchor="middle" font-size="10" fill="white">SearchBar</text>
    
    <rect x="400" y="475" width="150" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="475" y="500" text-anchor="middle" font-size="10" fill="white">TextSelectionToolbar</text>
    
    <rect x="560" y="475" width="170" height="40" fill="#F5B041" stroke="#F39C12" stroke-width="1" rx="4"/>
    <text x="645" y="500" text-anchor="middle" font-size="10" fill="white">NoteDialog</text>
  </g>
  
  <!-- 共享组件 -->
  <g id="shared-widgets">
    <rect x="50" y="680" width="1000" height="140" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="8"/>
    <text x="550" y="710" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      共享组件 (Shared Widgets)
    </text>
    
    <rect x="80" y="730" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="145" y="753" text-anchor="middle" font-size="11" fill="white">BookCard</text>
    
    <rect x="230" y="730" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="295" y="753" text-anchor="middle" font-size="11" fill="white">CustomButton</text>
    
    <rect x="380" y="730" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="445" y="753" text-anchor="middle" font-size="11" fill="white">GlassCard</text>
    
    <rect x="530" y="730" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="595" y="753" text-anchor="middle" font-size="11" fill="white">LoadingIndicator</text>
    
    <rect x="680" y="730" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="745" y="753" text-anchor="middle" font-size="11" fill="white">EmptyState</text>
    
    <rect x="830" y="730" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="895" y="753" text-anchor="middle" font-size="11" fill="white">ErrorWidget</text>
    
    <rect x="230" y="775" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="295" y="798" text-anchor="middle" font-size="11" fill="white">CustomSlider</text>
    
    <rect x="380" y="775" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="445" y="798" text-anchor="middle" font-size="11" fill="white">AnimatedIcon</text>
    
    <rect x="530" y="775" width="130" height="35" fill="#5D6D7E" rx="4"/>
    <text x="595" y="798" text-anchor="middle" font-size="11" fill="white">ThemeSelector</text>
  </g>
  
  <!-- 连接线 -->
  <defs>
    <marker id="comp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Root到MaterialApp -->
  <line x1="550" y1="120" x2="550" y2="150" stroke="#666" stroke-width="2" marker-end="url(#comp-arrow)"/>
  
  <!-- MaterialApp到各页面 -->
  <line x1="470" y1="200" x2="140" y2="250" stroke="#666" stroke-width="2" marker-end="url(#comp-arrow)"/>
  <line x1="510" y1="200" x2="350" y2="250" stroke="#666" stroke-width="2" marker-end="url(#comp-arrow)"/>
  <line x1="550" y1="200" x2="560" y2="250" stroke="#666" stroke-width="2" marker-end="url(#comp-arrow)"/>
  <line x1="590" y1="200" x2="770" y2="250" stroke="#666" stroke-width="2" marker-end="url(#comp-arrow)"/>
  <line x1="630" y1="200" x2="980" y2="250" stroke="#666" stroke-width="2" marker-end="url(#comp-arrow)"/>
  
  <!-- 页面到子组件 -->
  <line x1="140" y1="310" x2="140" y2="360" stroke="#27AE60" stroke-width="2" marker-end="url(#comp-arrow)"/>
  <line x1="560" y1="310" x2="560" y2="360" stroke="#F39C12" stroke-width="2" marker-end="url(#comp-arrow)"/>
  
  <!-- 各组件到共享组件（虚线） -->
  <line x1="350" y1="310" x2="350" y2="680" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="770" y1="310" x2="770" y2="680" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="980" y1="310" x2="980" y2="680" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
</svg>