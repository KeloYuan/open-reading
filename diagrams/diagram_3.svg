<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <!-- 背景 -->
  <rect width="800" height="900" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
    数据流程图
  </text>
  
  <!-- 用户操作 -->
  <ellipse cx="400" cy="80" rx="80" ry="40" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    用户操作
  </text>
  
  <!-- 导入书籍流程 -->
  <g id="import-flow">
    <rect x="50" y="150" width="200" height="180" fill="none" stroke="#3498DB" stroke-width="2" stroke-dasharray="5,5" rx="8"/>
    <text x="150" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#3498DB">
      导入书籍流程
    </text>
    
    <rect x="80" y="190" width="140" height="40" fill="#3498DB" stroke="#2874A6" stroke-width="1" rx="4"/>
    <text x="150" y="215" text-anchor="middle" font-size="11" fill="white">1. 选择文件</text>
    
    <rect x="80" y="240" width="140" height="40" fill="#3498DB" stroke="#2874A6" stroke-width="1" rx="4"/>
    <text x="150" y="265" text-anchor="middle" font-size="11" fill="white">2. 解析元数据</text>
    
    <rect x="80" y="290" width="140" height="40" fill="#3498DB" stroke="#2874A6" stroke-width="1" rx="4"/>
    <text x="150" y="315" text-anchor="middle" font-size="11" fill="white">3. 存入数据库</text>
  </g>
  
  <!-- 阅读流程 -->
  <g id="reading-flow">
    <rect x="300" y="150" width="200" height="280" fill="none" stroke="#27AE60" stroke-width="2" stroke-dasharray="5,5" rx="8"/>
    <text x="400" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">
      阅读流程
    </text>
    
    <rect x="330" y="190" width="140" height="40" fill="#27AE60" stroke="#1E8449" stroke-width="1" rx="4"/>
    <text x="400" y="215" text-anchor="middle" font-size="11" fill="white">1. 加载书籍</text>
    
    <rect x="330" y="240" width="140" height="40" fill="#27AE60" stroke="#1E8449" stroke-width="1" rx="4"/>
    <text x="400" y="265" text-anchor="middle" font-size="11" fill="white">2. 解析内容</text>
    
    <rect x="330" y="290" width="140" height="40" fill="#27AE60" stroke="#1E8449" stroke-width="1" rx="4"/>
    <text x="400" y="315" text-anchor="middle" font-size="11" fill="white">3. 智能分页</text>
    
    <rect x="330" y="340" width="140" height="40" fill="#27AE60" stroke="#1E8449" stroke-width="1" rx="4"/>
    <text x="400" y="365" text-anchor="middle" font-size="11" fill="white">4. 渲染显示</text>
    
    <rect x="330" y="390" width="140" height="40" fill="#27AE60" stroke="#1E8449" stroke-width="1" rx="4"/>
    <text x="400" y="415" text-anchor="middle" font-size="11" fill="white">5. 保存进度</text>
  </g>
  
  <!-- 笔记流程 -->
  <g id="note-flow">
    <rect x="550" y="150" width="200" height="230" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="5,5" rx="8"/>
    <text x="650" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#F39C12">
      笔记流程
    </text>
    
    <rect x="580" y="190" width="140" height="40" fill="#F39C12" stroke="#CA6F1E" stroke-width="1" rx="4"/>
    <text x="650" y="215" text-anchor="middle" font-size="11" fill="white">1. 选择文本</text>
    
    <rect x="580" y="240" width="140" height="40" fill="#F39C12" stroke="#CA6F1E" stroke-width="1" rx="4"/>
    <text x="650" y="265" text-anchor="middle" font-size="11" fill="white">2. 高亮/书签</text>
    
    <rect x="580" y="290" width="140" height="40" fill="#F39C12" stroke="#CA6F1E" stroke-width="1" rx="4"/>
    <text x="650" y="315" text-anchor="middle" font-size="11" fill="white">3. 添加笔记</text>
    
    <rect x="580" y="340" width="140" height="40" fill="#F39C12" stroke="#CA6F1E" stroke-width="1" rx="4"/>
    <text x="650" y="365" text-anchor="middle" font-size="11" fill="white">4. 保存数据</text>
  </g>
  
  <!-- 数据库层 -->
  <rect x="50" y="480" width="700" height="100" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="8"/>
  <text x="400" y="510" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
    数据库层 (SQLite)
  </text>
  <text x="150" y="540" font-size="12" fill="white">• books（书籍表）</text>
  <text x="300" y="540" font-size="12" fill="white">• bookmarks（书签表）</text>
  <text x="480" y="540" font-size="12" fill="white">• notes（笔记表）</text>
  <text x="150" y="560" font-size="12" fill="white">• highlights（高亮表）</text>
  <text x="330" y="560" font-size="12" fill="white">• reading_stats（统计表）</text>
  
  <!-- 本地存储 -->
  <rect x="50" y="610" width="340" height="80" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="8"/>
  <text x="220" y="640" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    本地文件存储
  </text>
  <text x="220" y="665" text-anchor="middle" font-size="11" fill="white">
    书籍文件 | 封面图片 | 配置文件
  </text>
  
  <!-- 缓存系统 -->
  <rect x="410" y="610" width="340" height="80" fill="#16A085" stroke="#138D75" stroke-width="2" rx="8"/>
  <text x="580" y="640" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    缓存系统
  </text>
  <text x="580" y="665" text-anchor="middle" font-size="11" fill="white">
    分页缓存 | 图片缓存 | 配置缓存
  </text>
  
  <!-- 数据输出 -->
  <rect x="250" y="730" width="300" height="80" fill="#E67E22" stroke="#CA6F1E" stroke-width="2" rx="8"/>
  <text x="400" y="760" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    数据输出
  </text>
  <text x="400" y="785" text-anchor="middle" font-size="11" fill="white">
    阅读统计 | 数据导出 | 备份恢复
  </text>
  
  <!-- 连接线 -->
  <defs>
    <marker id="arrow-flow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
  </defs>
  
  <!-- 从用户到各流程 -->
  <line x1="350" y1="100" x2="150" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="400" y1="120" x2="400" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="450" y1="100" x2="650" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  
  <!-- 从流程到数据库 -->
  <line x1="150" y1="330" x2="200" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="400" y1="430" x2="400" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="650" y1="380" x2="600" y2="480" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  
  <!-- 从数据库到存储 -->
  <line x1="220" y1="580" x2="220" y2="610" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="580" y1="580" x2="580" y2="610" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  
  <!-- 从存储到输出 -->
  <line x1="280" y1="690" x2="350" y2="730" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="520" y1="690" x2="450" y2="730" stroke="#555" stroke-width="2" marker-end="url(#arrow-flow)"/>
  
  <!-- 说明 -->
  <g id="flow-description">
    <rect x="50" y="830" width="700" height="50" fill="white" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="60" y="850" font-size="11" font-weight="bold" fill="#333">流程说明：</text>
    <text x="60" y="865" font-size="10" fill="#666">
      用户操作触发不同流程 → 处理后存入数据库 → 持久化到本地存储/缓存 → 生成统计数据输出
    </text>
  </g>
</svg>