<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- 背景 -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="500" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">
    数据库实体关系图 (ERD)
  </text>
  
  <!-- books表 -->
  <g id="books-table">
    <rect x="50" y="80" width="280" height="260" fill="#3498DB" stroke="#2874A6" stroke-width="2" rx="8"/>
    <rect x="50" y="80" width="280" height="40" fill="#2874A6" rx="8"/>
    <text x="190" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      books (书籍表)
    </text>
    
    <!-- 字段列表 -->
    <text x="70" y="145" font-size="13" font-weight="bold" fill="white">🔑 id: INTEGER</text>
    <text x="70" y="170" font-size="12" fill="white">title: TEXT (书名)</text>
    <text x="70" y="190" font-size="12" fill="white">author: TEXT (作者)</text>
    <text x="70" y="210" font-size="12" fill="white">file_path: TEXT (文件路径)</text>
    <text x="70" y="230" font-size="12" fill="white">cover_path: TEXT (封面)</text>
    <text x="70" y="250" font-size="12" fill="white">last_position: INTEGER (位置)</text>
    <text x="70" y="270" font-size="12" fill="white">progress: REAL (进度)</text>
    <text x="70" y="290" font-size="12" fill="white">created_at: TEXT (创建时间)</text>
    <text x="70" y="310" font-size="12" fill="white">updated_at: TEXT (更新时间)</text>
  </g>
  
  <!-- bookmarks表 -->
  <g id="bookmarks-table">
    <rect x="380" y="80" width="260" height="200" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="8"/>
    <rect x="380" y="80" width="260" height="40" fill="#7D3C98" rx="8"/>
    <text x="510" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      bookmarks (书签表)
    </text>
    
    <text x="400" y="145" font-size="13" font-weight="bold" fill="white">🔑 id: INTEGER</text>
    <text x="400" y="170" font-size="12" fill="white">🔗 book_id: INTEGER (外键)</text>
    <text x="400" y="190" font-size="12" fill="white">page_number: INTEGER (页码)</text>
    <text x="400" y="210" font-size="12" fill="white">position: TEXT (位置信息)</text>
    <text x="400" y="230" font-size="12" fill="white">note: TEXT (备注)</text>
    <text x="400" y="250" font-size="12" fill="white">created_at: TEXT (创建时间)</text>
  </g>
  
  <!-- notes表 -->
  <g id="notes-table">
    <rect x="690" y="80" width="260" height="220" fill="#F39C12" stroke="#CA6F1E" stroke-width="2" rx="8"/>
    <rect x="690" y="80" width="260" height="40" fill="#CA6F1E" rx="8"/>
    <text x="820" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      notes (笔记表)
    </text>
    
    <text x="710" y="145" font-size="13" font-weight="bold" fill="white">🔑 id: INTEGER</text>
    <text x="710" y="170" font-size="12" fill="white">🔗 book_id: INTEGER (外键)</text>
    <text x="710" y="190" font-size="12" fill="white">content: TEXT (笔记内容)</text>
    <text x="710" y="210" font-size="12" fill="white">selected_text: TEXT (选中文本)</text>
    <text x="710" y="230" font-size="12" fill="white">position: TEXT (位置)</text>
    <text x="710" y="250" font-size="12" fill="white">tags: TEXT (标签JSON)</text>
    <text x="710" y="270" font-size="12" fill="white">created_at: TEXT</text>
  </g>
  
  <!-- highlights表 -->
  <g id="highlights-table">
    <rect x="50" y="380" width="280" height="200" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="8"/>
    <rect x="50" y="380" width="280" height="40" fill="#1E8449" rx="8"/>
    <text x="190" y="405" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      highlights (高亮表)
    </text>
    
    <text x="70" y="445" font-size="13" font-weight="bold" fill="white">🔑 id: INTEGER</text>
    <text x="70" y="470" font-size="12" fill="white">🔗 book_id: INTEGER (外键)</text>
    <text x="70" y="490" font-size="12" fill="white">text: TEXT (高亮文本)</text>
    <text x="70" y="510" font-size="12" fill="white">color: TEXT (高亮颜色)</text>
    <text x="70" y="530" font-size="12" fill="white">position: TEXT (位置信息)</text>
    <text x="70" y="550" font-size="12" fill="white">created_at: TEXT</text>
  </g>
  
  <!-- reading_stats表 -->
  <g id="stats-table">
    <rect x="380" y="320" width="280" height="220" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="8"/>
    <rect x="380" y="320" width="280" height="40" fill="#C0392B" rx="8"/>
    <text x="520" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      reading_stats (统计表)
    </text>
    
    <text x="400" y="385" font-size="13" font-weight="bold" fill="white">🔑 id: INTEGER</text>
    <text x="400" y="410" font-size="12" fill="white">🔗 book_id: INTEGER (外键)</text>
    <text x="400" y="430" font-size="12" fill="white">reading_date: TEXT (日期)</text>
    <text x="400" y="450" font-size="12" fill="white">duration: INTEGER (时长/秒)</text>
    <text x="400" y="470" font-size="12" fill="white">pages_read: INTEGER (页数)</text>
    <text x="400" y="490" font-size="12" fill="white">created_at: TEXT</text>
  </g>
  
  <!-- 关系线 -->
  <defs>
    <marker id="fk-arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#C0392B" />
    </marker>
  </defs>
  
  <!-- books to bookmarks -->
  <path d="M 330 180 L 380 180" stroke="#C0392B" stroke-width="3" marker-start="url(#fk-arrow)" fill="none"/>
  <text x="350" y="170" font-size="11" fill="#C0392B" font-weight="bold">1:N</text>
  
  <!-- books to notes -->
  <path d="M 330 140 L 380 140 L 380 100 L 690 100" stroke="#C0392B" stroke-width="3" marker-start="url(#fk-arrow)" fill="none"/>
  <text x="500" y="90" font-size="11" fill="#C0392B" font-weight="bold">1:N</text>
  
  <!-- books to highlights -->
  <path d="M 190 340 L 190 380" stroke="#C0392B" stroke-width="3" marker-start="url(#fk-arrow)" fill="none"/>
  <text x="200" y="365" font-size="11" fill="#C0392B" font-weight="bold">1:N</text>
  
  <!-- books to stats -->
  <path d="M 280 340 L 380 340 L 380 400" stroke="#C0392B" stroke-width="3" marker-start="url(#fk-arrow)" fill="none"/>
  <text x="330" y="370" font-size="11" fill="#C0392B" font-weight="bold">1:N</text>
  
  <!-- 图例 -->
  <g id="legend">
    <rect x="700" y="380" width="250" height="120" fill="white" stroke="#ddd" stroke-width="2" rx="6"/>
    <text x="720" y="405" font-size="14" font-weight="bold" fill="#333">图例说明</text>
    <text x="720" y="430" font-size="12" fill="#666">🔑 主键 (Primary Key)</text>
    <text x="720" y="450" font-size="12" fill="#666">🔗 外键 (Foreign Key)</text>
    <line x1="720" y1="465" x2="780" y2="465" stroke="#C0392B" stroke-width="3" marker-start="url(#fk-arrow)"/>
    <text x="790" y="470" font-size="12" fill="#666">外键关系</text>
    <text x="720" y="490" font-size="12" fill="#666">1:N - 一对多关系</text>
  </g>
  
  <!-- 说明 -->
  <rect x="50" y="620" width="900" height="60" fill="white" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="70" y="645" font-size="12" font-weight="bold" fill="#333">数据库设计说明：</text>
  <text x="70" y="665" font-size="11" fill="#666">
    books表为核心表，其他表通过book_id外键关联。支持一本书对应多个书签、笔记、高亮和统计记录。
  </text>
</svg>