<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
    小元读书系统架构图
  </text>
  
  <!-- 表现层 -->
  <g id="presentation-layer">
    <rect x="50" y="60" width="700" height="80" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="8"/>
    <text x="400" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
      表现层 (UI Layer)
    </text>
    <text x="100" y="115" font-size="14" fill="white">
      主页 | 阅读页 | 书库页 | 统计页 | 设置页
    </text>
  </g>
  
  <!-- 业务逻辑层 -->
  <g id="business-layer">
    <rect x="50" y="160" width="700" height="120" fill="#50C878" stroke="#3A9B5C" stroke-width="2" rx="8"/>
    <text x="400" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
      业务逻辑层 (Service Layer)
    </text>
    
    <!-- 服务模块 -->
    <rect x="80" y="210" width="150" height="50" fill="#3A9B5C" rx="4"/>
    <text x="155" y="240" text-anchor="middle" font-size="12" fill="white">书籍导入服务</text>
    
    <rect x="250" y="210" width="150" height="50" fill="#3A9B5C" rx="4"/>
    <text x="325" y="240" text-anchor="middle" font-size="12" fill="white">阅读引擎服务</text>
    
    <rect x="420" y="210" width="150" height="50" fill="#3A9B5C" rx="4"/>
    <text x="495" y="240" text-anchor="middle" font-size="12" fill="white">存储服务</text>
    
    <rect x="590" y="210" width="140" height="50" fill="#3A9B5C" rx="4"/>
    <text x="660" y="240" text-anchor="middle" font-size="12" fill="white">分页服务</text>
  </g>
  
  <!-- 数据访问层 -->
  <g id="data-access-layer">
    <rect x="50" y="300" width="700" height="100" fill="#F39C12" stroke="#C87F0A" stroke-width="2" rx="8"/>
    <text x="400" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
      数据访问层 (DAO Layer)
    </text>
    
    <!-- DAO模块 -->
    <rect x="80" y="350" width="120" height="35" fill="#C87F0A" rx="4"/>
    <text x="140" y="372" text-anchor="middle" font-size="11" fill="white">BookDao</text>
    
    <rect x="220" y="350" width="120" height="35" fill="#C87F0A" rx="4"/>
    <text x="280" y="372" text-anchor="middle" font-size="11" fill="white">BookmarkDao</text>
    
    <rect x="360" y="350" width="120" height="35" fill="#C87F0A" rx="4"/>
    <text x="420" y="372" text-anchor="middle" font-size="11" fill="white">NoteDao</text>
    
    <rect x="500" y="350" width="120" height="35" fill="#C87F0A" rx="4"/>
    <text x="560" y="372" text-anchor="middle" font-size="11" fill="white">HighlightDao</text>
    
    <rect x="640" y="350" width="110" height="35" fill="#C87F0A" rx="4"/>
    <text x="695" y="372" text-anchor="middle" font-size="11" fill="white">StatsDao</text>
  </g>
  
  <!-- 数据存储层 -->
  <g id="storage-layer">
    <rect x="50" y="420" width="340" height="80" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="8"/>
    <text x="220" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
      数据存储层
    </text>
    <text x="100" y="475" font-size="14" fill="white">SQLite数据库</text>
    <text x="270" y="475" font-size="14" fill="white">本地文件</text>
    
    <rect x="410" y="420" width="340" height="80" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="8"/>
    <text x="580" y="450" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
      外部依赖
    </text>
    <text x="460" y="475" font-size="14" fill="white">EPUB解析</text>
    <text x="600" y="475" font-size="14" fill="white">PDF渲染</text>
    <text x="720" y="475" font-size="14" fill="white">文件系统</text>
  </g>
  
  <!-- 连接线 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <line x1="400" y1="140" x2="400" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="280" x2="400" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="400" x2="220" y2="420" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="400" x2="580" y2="420" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 图例 -->
  <g id="legend">
    <rect x="50" y="520" width="700" height="60" fill="white" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="60" y="540" font-size="12" font-weight="bold" fill="#333">图例说明：</text>
    <text x="60" y="560" font-size="11" fill="#666">
      表现层负责UI展示 | 业务逻辑层处理核心功能 | 数据访问层封装数据操作 | 数据存储层负责持久化
    </text>
  </g>
</svg>