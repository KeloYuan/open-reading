<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
    书籍导入流程详细设计
  </text>
  
  <!-- 开始 -->
  <ellipse cx="450" cy="90" rx="60" ry="35" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
  <text x="450" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="white">开始</text>
  
  <!-- 用户选择文件 -->
  <rect x="350" y="150" width="200" height="60" fill="#3498DB" stroke="#2874A6" stroke-width="2" rx="8"/>
  <text x="450" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="white">用户选择文件</text>
  <text x="450" y="195" text-anchor="middle" font-size="11" fill="white">file_picker 组件</text>
  
  <!-- 判断格式 -->
  <path d="M 370 260 L 450 230 L 530 260 L 450 290 Z" fill="#F39C12" stroke="#CA6F1E" stroke-width="2"/>
  <text x="450" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="white">支持格式?</text>
  
  <!-- 不支持格式 -->
  <rect x="620" y="240" width="180" height="50" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="6"/>
  <text x="710" y="260" text-anchor="middle" font-size="12" fill="white">显示错误提示</text>
  <text x="710" y="278" text-anchor="middle" font-size="10" fill="white">不支持的格式</text>
  
  <!-- 解析元数据 -->
  <rect x="350" y="330" width="200" height="70" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="8"/>
  <text x="450" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="white">解析元数据</text>
  <text x="450" y="375" text-anchor="middle" font-size="11" fill="white">• 提取标题、作者</text>
  <text x="450" y="392" text-anchor="middle" font-size="11" fill="white">• 提取封面图片</text>
  
  <!-- 生成哈希 -->
  <rect x="350" y="430" width="200" height="50" fill="#16A085" stroke="#138D75" stroke-width="2" rx="8"/>
  <text x="450" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="white">生成文件哈希</text>
  <text x="450" y="468" text-anchor="middle" font-size="11" fill="white">crypto库 MD5/SHA256</text>
  
  <!-- 检查重复 -->
  <path d="M 370 530 L 450 500 L 530 530 L 450 560 Z" fill="#E67E22" stroke="#CA6F1E" stroke-width="2"/>
  <text x="450" y="535" text-anchor="middle" font-size="12" font-weight="bold" fill="white">已存在?</text>
  
  <!-- 已存在 -->
  <rect x="620" y="510" width="180" height="50" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="6"/>
  <text x="710" y="530" text-anchor="middle" font-size="12" fill="white">提示重复</text>
  <text x="710" y="548" text-anchor="middle" font-size="10" fill="white">书籍已在书库中</text>
  
  <!-- 保存到数据库 -->
  <rect x="100" y="520" width="180" height="50" fill="#2980B9" stroke="#1F618D" stroke-width="2" rx="8"/>
  <text x="190" y="540" text-anchor="middle" font-size="13" font-weight="bold" fill="white">保存到数据库</text>
  <text x="190" y="558" text-anchor="middle" font-size="11" fill="white">SQLite books表</text>
  
  <!-- 复制文件 -->
  <rect x="100" y="600" width="180" height="50" fill="#8E44AD" stroke="#6C3483" stroke-width="2" rx="8"/>
  <text x="190" y="620" text-anchor="middle" font-size="13" font-weight="bold" fill="white">复制文件到应用目录</text>
  <text x="190" y="638" text-anchor="middle" font-size="11" fill="white">保存原文件</text>
  
  <!-- 完成 -->
  <ellipse cx="190" cy="685" rx="60" ry="25" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
  <text x="190" y="692" text-anchor="middle" font-size="13" font-weight="bold" fill="white">导入完成</text>
  
  <!-- 返回 -->
  <path d="M 710 290 L 710 320 L 820 320 L 820 110 L 520 110" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)" fill="none"/>
  <path d="M 710 560 L 710 590 L 820 590 L 820 110 L 520 110" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)" fill="none"/>
  
  <!-- 连接线 -->
  <defs>
    <marker id="arrow-import" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <line x1="450" y1="125" x2="450" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  <line x1="450" y1="210" x2="450" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  
  <!-- 支持格式 -->
  <line x1="450" y1="290" x2="450" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  <text x="465" y="315" font-size="11" fill="#27AE60" font-weight="bold">是</text>
  
  <!-- 不支持 -->
  <line x1="530" y1="260" x2="620" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  <text x="570" y="250" font-size="11" fill="#E74C3C" font-weight="bold">否</text>
  
  <line x1="450" y1="400" x2="450" y2="430" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  <line x1="450" y1="480" x2="450" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  
  <!-- 不存在 -->
  <line x1="370" y1="530" x2="280" y2="530" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  <text x="315" y="520" font-size="11" fill="#27AE60" font-weight="bold">否</text>
  
  <!-- 已存在 -->
  <line x1="530" y1="530" x2="620" y2="530" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  <text x="570" y="520" font-size="11" fill="#E74C3C" font-weight="bold">是</text>
  
  <line x1="190" y1="570" x2="190" y2="600" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  <line x1="190" y1="650" x2="190" y2="660" stroke="#666" stroke-width="2" marker-end="url(#arrow-import)"/>
  
  <!-- 说明框 -->
  <g id="legend-import">
    <rect x="20" y="20" width="280" height="120" fill="white" stroke="#ddd" stroke-width="2" rx="6"/>
    <text x="35" y="45" font-size="13" font-weight="bold" fill="#333">支持的格式：</text>
    <text x="35" y="70" font-size="11" fill="#666">• EPUB (.epub) - epubx库</text>
    <text x="35" y="90" font-size="11" fill="#666">• PDF (.pdf) - pdfx库</text>
    <text x="35" y="110" font-size="11" fill="#666">• TXT (.txt) - 纯文本</text>
    <text x="35" y="130" font-size="11" fill="#666">• 其他压缩格式 - archive库</text>
  </g>
</svg>