<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">
    功能模块关系图
  </text>
  
  <!-- 中心核心模块 -->
  <circle cx="450" cy="350" r="80" fill="#E74C3C" stroke="#C0392B" stroke-width="3"/>
  <text x="450" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
    阅读引擎
  </text>
  <text x="450" y="360" text-anchor="middle" font-size="14" fill="white">
    核心模块
  </text>
  
  <!-- 书库管理 -->
  <g id="library-module">
    <rect x="100" y="80" width="140" height="100" fill="#3498DB" stroke="#2874A6" stroke-width="2" rx="8"/>
    <text x="170" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      书库管理
    </text>
    <text x="170" y="135" text-anchor="middle" font-size="11" fill="white">• 书籍导入</text>
    <text x="170" y="155" text-anchor="middle" font-size="11" fill="white">• 书籍分类</text>
    <text x="170" y="175" text-anchor="middle" font-size="11" fill="white">• 封面管理</text>
  </g>
  
  <!-- 阅读设置 -->
  <g id="reading-settings">
    <rect x="660" y="80" width="140" height="100" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="8"/>
    <text x="730" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      阅读设置
    </text>
    <text x="730" y="135" text-anchor="middle" font-size="11" fill="white">• 主题切换</text>
    <text x="730" y="155" text-anchor="middle" font-size="11" fill="white">• 字体调节</text>
    <text x="730" y="175" text-anchor="middle" font-size="11" fill="white">• 亮度控制</text>
  </g>
  
  <!-- 笔记系统 -->
  <g id="note-system">
    <rect x="100" y="520" width="140" height="100" fill="#F39C12" stroke="#CA6F1E" stroke-width="2" rx="8"/>
    <text x="170" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      笔记系统
    </text>
    <text x="170" y="575" text-anchor="middle" font-size="11" fill="white">• 文本高亮</text>
    <text x="170" y="595" text-anchor="middle" font-size="11" fill="white">• 书签管理</text>
    <text x="170" y="615" text-anchor="middle" font-size="11" fill="white">• 笔记编辑</text>
  </g>
  
  <!-- 统计分析 -->
  <g id="statistics">
    <rect x="660" y="520" width="140" height="100" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="8"/>
    <text x="730" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      统计分析
    </text>
    <text x="730" y="575" text-anchor="middle" font-size="11" fill="white">• 阅读时长</text>
    <text x="730" y="595" text-anchor="middle" font-size="11" fill="white">• 进度追踪</text>
    <text x="730" y="615" text-anchor="middle" font-size="11" fill="white">• 数据图表</text>
  </g>
  
  <!-- 格式解析 -->
  <g id="format-parser">
    <rect x="300" y="280" width="120" height="70" fill="#16A085" stroke="#138D75" stroke-width="2" rx="6"/>
    <text x="360" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="white">
      格式解析
    </text>
    <text x="360" y="325" text-anchor="middle" font-size="10" fill="white">EPUB | PDF</text>
    <text x="360" y="340" text-anchor="middle" font-size="10" fill="white">TXT | 更多</text>
  </g>
  
  <!-- 智能分页 -->
  <g id="pagination">
    <rect x="480" y="280" width="120" height="70" fill="#D35400" stroke="#A04000" stroke-width="2" rx="6"/>
    <text x="540" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="white">
      智能分页
    </text>
    <text x="540" y="325" text-anchor="middle" font-size="10" fill="white">自适应布局</text>
    <text x="540" y="340" text-anchor="middle" font-size="10" fill="white">缓存优化</text>
  </g>
  
  <!-- 数据存储 -->
  <g id="data-storage">
    <rect x="380" y="450" width="140" height="60" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="6"/>
    <text x="450" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="white">
      数据存储
    </text>
    <text x="450" y="495" text-anchor="middle" font-size="10" fill="white">SQLite + 本地文件</text>
  </g>
  
  <!-- 连接线定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
  </defs>
  
  <!-- 连接线 - 从各模块到核心 -->
  <line x1="240" y1="130" x2="390" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <line x1="660" y1="130" x2="510" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <line x1="240" y1="570" x2="390" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <line x1="660" y1="570" x2="510" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  
  <!-- 核心模块内部连接 -->
  <line x1="370" y1="315" x2="420" y2="330" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="330" x2="450" y2="350" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="430" x2="450" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 说明文字 -->
  <g id="description">
    <rect x="50" y="640" width="800" height="45" fill="white" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="60" y="660" font-size="11" font-weight="bold" fill="#333">模块说明：</text>
    <text x="60" y="675" font-size="10" fill="#666">
      各功能模块围绕阅读引擎核心展开，通过数据存储层实现数据持久化，模块间通过标准接口通信
    </text>
  </g>
</svg>