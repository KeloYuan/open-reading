<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750">
  <!-- 背景 -->
  <rect width="1000" height="750" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="500" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">
    智能分页算法设计
  </text>
  
  <!-- 输入 -->
  <g id="input">
    <rect x="50" y="80" width="220" height="150" fill="#3498DB" stroke="#2874A6" stroke-width="2" rx="8"/>
    <text x="160" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      输入参数
    </text>
    <text x="80" y="140" font-size="12" fill="white">• 文本内容</text>
    <text x="80" y="165" font-size="12" fill="white">• 屏幕尺寸</text>
    <text x="80" y="190" font-size="12" fill="white">• 字体大小</text>
    <text x="80" y="215" font-size="12" fill="white">• 行间距/段间距</text>
  </g>
  
  <!-- 文本测量 -->
  <g id="text-measure">
    <rect x="320" y="80" width="220" height="150" fill="#9B59B6" stroke="#7D3C98" stroke-width="2" rx="8"/>
    <text x="430" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      文本测量
    </text>
    <text x="350" y="140" font-size="12" fill="white">• TextPainter测量</text>
    <text x="350" y="165" font-size="12" fill="white">• 计算文本高度</text>
    <text x="350" y="190" font-size="12" fill="white">• 计算换行位置</text>
    <text x="350" y="215" font-size="12" fill="white">• 识别段落边界</text>
  </g>
  
  <!-- 分页计算 -->
  <g id="pagination">
    <rect x="590" y="80" width="220" height="150" fill="#F39C12" stroke="#CA6F1E" stroke-width="2" rx="8"/>
    <text x="700" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      分页计算
    </text>
    <text x="620" y="140" font-size="12" fill="white">• 计算每页行数</text>
    <text x="620" y="165" font-size="12" fill="white">• 避免段落孤行</text>
    <text x="620" y="190" font-size="12" fill="white">• 处理图片和空白</text>
    <text x="620" y="215" font-size="12" fill="white">• 生成页面边界</text>
  </g>
  
  <!-- 算法流程 -->
  <g id="algorithm">
    <rect x="50" y="280" width="760" height="400" fill="white" stroke="#2C3E50" stroke-width="2" rx="8"/>
    <text x="430" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
      分页算法流程
    </text>
    
    <!-- Step 1 -->
    <rect x="80" y="330" width="200" height="70" fill="#16A085" stroke="#138D75" stroke-width="2" rx="6"/>
    <text x="180" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      1. 初始化
    </text>
    <text x="180" y="377" text-anchor="middle" font-size="11" fill="white">创建TextPainter</text>
    <text x="180" y="394" text-anchor="middle" font-size="11" fill="white">设置字体样式</text>
    
    <!-- Step 2 -->
    <rect x="310" y="330" width="200" height="70" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="6"/>
    <text x="410" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      2. 计算单页容量
    </text>
    <text x="410" y="377" text-anchor="middle" font-size="11" fill="white">可用高度 / (字体高度 + 行距)</text>
    <text x="410" y="394" text-anchor="middle" font-size="11" fill="white">= 每页最大行数</text>
    
    <!-- Step 3 -->
    <rect x="540" y="330" width="200" height="70" fill="#8E44AD" stroke="#6C3483" stroke-width="2" rx="6"/>
    <text x="640" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      3. 遍历文本
    </text>
    <text x="640" y="377" text-anchor="middle" font-size="11" fill="white">逐段落处理</text>
    <text x="640" y="394" text-anchor="middle" font-size="11" fill="white">计算实际占用行数</text>
    
    <!-- Step 4 -->
    <rect x="80" y="430" width="200" height="70" fill="#E67E22" stroke="#CA6F1E" stroke-width="2" rx="6"/>
    <text x="180" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      4. 累计行数
    </text>
    <text x="180" y="477" text-anchor="middle" font-size="11" fill="white">currentLines += 段落行数</text>
    <text x="180" y="494" text-anchor="middle" font-size="11" fill="white">检查是否超出页面</text>
    
    <!-- Step 5 -->
    <rect x="310" y="430" width="200" height="70" fill="#2980B9" stroke="#1F618D" stroke-width="2" rx="6"/>
    <text x="410" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      5. 决策分页
    </text>
    <text x="410" y="477" text-anchor="middle" font-size="11" fill="white">if (超出) 创建新页</text>
    <text x="410" y="494" text-anchor="middle" font-size="11" fill="white">记录分页点位置</text>
    
    <!-- Step 6 -->
    <rect x="540" y="430" width="200" height="70" fill="#C0392B" stroke="#922B21" stroke-width="2" rx="6"/>
    <text x="640" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      6. 优化调整
    </text>
    <text x="640" y="477" text-anchor="middle" font-size="11" fill="white">避免孤行</text>
    <text x="640" y="494" text-anchor="middle" font-size="11" fill="white">处理图片位置</text>
    
    <!-- Step 7 -->
    <rect x="195" y="530" width="200" height="70" fill="#D35400" stroke="#A04000" stroke-width="2" rx="6"/>
    <text x="295" y="555" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      7. 生成索引
    </text>
    <text x="295" y="577" text-anchor="middle" font-size="11" fill="white">Map&lt;pageNum, textRange&gt;</text>
    <text x="295" y="594" text-anchor="middle" font-size="11" fill="white">记录每页文本范围</text>
    
    <!-- Step 8 -->
    <rect x="425" y="530" width="200" height="70" fill="#16A085" stroke="#138D75" stroke-width="2" rx="6"/>
    <text x="525" y="555" text-anchor="middle" font-size="13" font-weight="bold" fill="white">
      8. 缓存结果
    </text>
    <text x="525" y="577" text-anchor="middle" font-size="11" fill="white">保存分页结果</text>
    <text x="525" y="594" text-anchor="middle" font-size="11" fill="white">避免重复计算</text>
    
    <!-- 流程箭头 -->
    <defs>
      <marker id="arrow-algo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#666" />
      </marker>
    </defs>
    
    <line x1="280" y1="365" x2="310" y2="365" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    <line x1="510" y1="365" x2="540" y2="365" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    <line x1="640" y1="400" x2="640" y2="420" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    <line x1="540" y1="465" x2="510" y2="465" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    <line x1="310" y1="465" x2="280" y2="465" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    <line x1="180" y1="500" x2="180" y2="520" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    <line x1="180" y1="570" x2="195" y2="570" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    <line x1="395" y1="565" x2="425" y2="565" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
    
    <!-- 循环箭头 -->
    <path d="M 80 465 L 60 465 L 60 365 L 80 365" stroke="#999" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-algo)"/>
    <text x="45" y="420" font-size="10" fill="#999">循环</text>
  </g>
  
  <!-- 输出 -->
  <rect x="850" y="280" width="120" height="150" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="8"/>
  <text x="910" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
    输出结果
  </text>
  <text x="870" y="340" font-size="11" fill="white">页面总数</text>
  <text x="870" y="365" font-size="11" fill="white">分页索引</text>
  <text x="870" y="390" font-size="11" fill="white">页面内容</text>
  <text x="870" y="415" font-size="11" fill="white">缓存数据</text>
  
  <!-- 连接主流程 -->
  <line x1="270" y1="155" x2="320" y2="155" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
  <line x1="540" y1="155" x2="590" y2="155" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
  <line x1="700" y1="230" x2="700" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
  <line x1="810" y1="355" x2="850" y2="355" stroke="#666" stroke-width="2" marker-end="url(#arrow-algo)"/>
  
  <!-- 性能优化说明 -->
  <rect x="850" y="460" width="120" height="110" fill="#E8F6F3" stroke="#16A085" stroke-width="2" rx="6"/>
  <text x="910" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#138D75">
    性能优化
  </text>
  <text x="865" y="508" font-size="10" fill="#333">• 结果缓存</text>
  <text x="865" y="528" font-size="10" fill="#333">• 懒加载</text>
  <text x="865" y="548" font-size="10" fill="#333">• 预计算</text>
  <text x="865" y="568" font-size="10" fill="#333">• 增量更新</text>
</svg>